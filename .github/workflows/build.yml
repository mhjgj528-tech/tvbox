 name: Build TvBox APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Write project files
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TvBox"
          include(":app")
          EOF_0
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_2'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.tvbox"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tvbox"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_2
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_3'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="TV Box"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_3
          mkdir -p $(dirname app/src/main/java/com/example/tvbox/TvPresentation.kt)
          cat > app/src/main/java/com/example/tvbox/TvPresentation.kt <<'EOF_4'
          package com.example.tvbox

          import android.app.Presentation
          import android.content.Context
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Display
          import android.view.Gravity
          import android.widget.*

          class TvPresentation(
              context: Context,
              display: Display,
              private val apps: List<AppItem>
          ) : Presentation(context, display) {

              private val columns = 6
              private val cells = mutableListOf<LinearLayout>()
              private lateinit var scroll: ScrollView
              var selected = 0
                  private set

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(context).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#101418"))
                      setPadding(80, 60, 80, 60)
                  }
                  root.addView(TextView(context).apply {
                      text = "TV Box"
                      textSize = 40f
                      setTextColor(Color.WHITE)
                  })
                  scroll = ScrollView(context)
                  val grid = GridLayout(context).apply { columnCount = columns }
                  apps.forEach { app ->
                      val cell = LinearLayout(context).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          setPadding(24, 24, 24, 24)
                          addView(ImageView(context).apply {
                              setImageDrawable(app.icon)
                              layoutParams = LinearLayout.LayoutParams(160, 160)
                          })
                          addView(TextView(context).apply {
                              text = app.label
                              textSize = 18f
                              maxLines = 1
                              gravity = Gravity.CENTER
                              setTextColor(Color.WHITE)
                          })
                      }
                      val lp = GridLayout.LayoutParams().apply {
                          width = 260; height = 280; setMargins(12, 12, 12, 12)
                      }
                      grid.addView(cell, lp)
                      cells.add(cell)
                  }
                  scroll.addView(grid)
                  root.addView(scroll)
                  setContentView(root)
                  select(0)
              }

              fun move(dx: Int, dy: Int) {
                  if (apps.isEmpty()) return
                  val next = selected + dx + dy * columns
                  if (next in apps.indices) select(next)
              }

              private fun select(i: Int) {
                  cells.getOrNull(selected)?.background = null
                  selected = i
                  val c = cells.getOrNull(i) ?: return
                  c.background = GradientDrawable().apply {
                      setColor(Color.parseColor("#2A3440"))
                      setStroke(6, Color.WHITE)
                      cornerRadius = 24f
                  }
                  c.post { scroll.smoothScrollTo(0, (c.parent as GridLayout).top + c.top - 200) }
              }
          }
          EOF_4
          mkdir -p $(dirname app/src/main/java/com/example/tvbox/MainActivity.kt)
          cat > app/src/main/java/com/example/tvbox/MainActivity.kt <<'EOF_5'
          package com.example.tvbox

          import android.app.Activity
          import android.app.ActivityOptions
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.drawable.Drawable
          import android.hardware.display.DisplayManager
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Display
          import android.view.Gravity
          import android.view.View
          import android.widget.*

          data class AppItem(val label: String, val pkg: String, val icon: Drawable)

          class MainActivity : Activity(), DisplayManager.DisplayListener {

              private lateinit var dm: DisplayManager
              private lateinit var status: TextView
              private var presentation: TvPresentation? = null
              private var tvDisplay: Display? = null
              private lateinit var apps: List<AppItem>

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  dm = getSystemService(DISPLAY_SERVICE) as DisplayManager
                  apps = loadApps()
                  buildRemoteUi()
                  dm.registerDisplayListener(this, null)
                  refreshDisplay()
              }

              private fun loadApps(): List<AppItem> {
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  return packageManager.queryIntentActivities(i, 0)
                      .filter { it.activityInfo.packageName != packageName }
                      .map {
                          AppItem(
                              it.loadLabel(packageManager).toString(),
                              it.activityInfo.packageName,
                              it.loadIcon(packageManager)
                          )
                      }
                      .sortedBy { it.label.lowercase() }
              }

              // ---- Phone screen = remote control ----
              private fun buildRemoteUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(48, 48, 48, 48)
                  }
                  status = TextView(this).apply { textSize = 18f; gravity = Gravity.CENTER }
                  root.addView(status)
                  root.addView(btn("ط§طھطµط§ظ„ ط¨غŒâ€Œط³غŒظ… (Wi-Fi)") { openWireless() })
                  root.addView(btn("â–²") { presentation?.move(0, -1) })
                  val row = LinearLayout(this)
                  row.addView(btn("â—€") { presentation?.move(-1, 0) })
                  row.addView(btn("OK") { launchSelected() })
                  row.addView(btn("â–¶") { presentation?.move(1, 0) })
                  root.addView(row)
                  root.addView(btn("â–¼") { presentation?.move(0, 1) })
                  root.addView(btn("Home") { bringHomeToTv() })
                  setContentView(root)
              }

              private fun btn(t: String, onClick: () -> Unit) = Button(this).apply {
                  text = t
                  textSize = 24f
                  setOnClickListener { onClick() }
              }

              // ---- External display handling ----
              private fun refreshDisplay() {
                  val ext = dm.getDisplays(DisplayManager.DISPLAY_CATEGORY_PRESENTATION).firstOrNull()
                      ?: dm.displays.firstOrNull { it.displayId != Display.DEFAULT_DISPLAY }
                  if (ext?.displayId == tvDisplay?.displayId && presentation != null) return
                  presentation?.dismiss()
                  presentation = null
                  tvDisplay = ext
                  if (ext == null) {
                      status.text = "طھظ„ظˆغŒط²غŒظˆظ† ظˆطµظ„ ظ†غŒط³طھ"
                      return
                  }
                  presentation = TvPresentation(this, ext, apps).also { it.show() }
                  status.text = "ط¨ظ‡ طھظ„ظˆغŒط²غŒظˆظ† ظˆطµظ„ ط´ط¯"
              }

              private fun bringHomeToTv() = refreshDisplay()

              // Wireless mode: opens the system Cast / Miracast screen. Once the TV is
              // connected, Android exposes it as a second display and the same TV home appears.
              private fun openWireless() {
                  try {
                      startActivity(Intent(Settings.ACTION_CAST_SETTINGS))
                  } catch (e: Exception) {
                      startActivity(Intent(Settings.ACTION_WIFI_SETTINGS))
                  }
              }

              private fun launchSelected() {
                  val d = tvDisplay ?: return
                  val item = apps.getOrNull(presentation?.selected ?: return) ?: return
                  val intent = packageManager.getLaunchIntentForPackage(item.pkg) ?: return
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val opts = ActivityOptions.makeBasic().setLaunchDisplayId(d.displayId)
                  try {
                      startActivity(intent, opts.toBundle())
                  } catch (e: Exception) {
                      Toast.makeText(this, "ط§غŒظ† ط§ظ¾ ط±ظˆغŒ طھظ„ظˆغŒط²غŒظˆظ† ط¨ط§ط² ظ†ط´ط¯", Toast.LENGTH_LONG).show()
                  }
              }

              override fun onDisplayAdded(id: Int) = refreshDisplay()
              override fun onDisplayRemoved(id: Int) = refreshDisplay()
              override fun onDisplayChanged(id: Int) {}

              override fun onDestroy() {
                  dm.unregisterDisplayListener(this)
                  presentation?.dismiss()
                  super.onDestroy()
              }
          }
          EOF_5
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: TvBox v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk                     
