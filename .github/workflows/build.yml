        package com.example.tvbox

        import android.app.Activity
        import android.app.ActivityOptions
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.graphics.drawable.Drawable
        import android.hardware.display.DisplayManager
        import android.os.Bundle
        import android.provider.Settings
        import android.view.Display
        import android.view.Gravity
        import android.view.View
        import android.widget.*

        data class AppItem(val label: String, val pkg: String, val icon: Drawable)

        class MainActivity : Activity(), DisplayManager.DisplayListener {

            private lateinit var dm: DisplayManager
            private lateinit var status: TextView
            private var presentation: TvPresentation? = null
            private var tvDisplay: Display? = null
            private lateinit var apps: List<AppItem>

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                dm = getSystemService(DISPLAY_SERVICE) as DisplayManager
                apps = loadApps()
                buildRemoteUi()
                dm.registerDisplayListener(this, null)
                refreshDisplay()
            }

            private fun loadApps(): List<AppItem> {
                val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                return packageManager.queryIntentActivities(i, 0)
                    .filter { it.activityInfo.packageName != packageName }
                    .map {
                        AppItem(
                            it.loadLabel(packageManager).toString(),
                            it.activityInfo.packageName,
                            it.loadIcon(packageManager)
                        )
                    }
                    .sortedBy { it.label.lowercase() }
            }

            // ---- Phone screen = remote control ----
            private fun buildRemoteUi() {
                val root = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    gravity = Gravity.CENTER
                    setPadding(48, 48, 48, 48)
                }
                status = TextView(this).apply { textSize = 18f; gravity = Gravity.CENTER }
                root.addView(status)
                root.addView(btn("ط§طھطµط§ظ„ ط¨غŒâ€Œط³غŒظ… (Wi-Fi)") { openWireless() })
                root.addView(btn("â–²") { presentation?.move(0, -1) })
                val row = LinearLayout(this)
                row.addView(btn("â—€") { presentation?.move(-1, 0) })
                row.addView(btn("OK") { launchSelected() })
                row.addView(btn("â–¶") { presentation?.move(1, 0) })
                root.addView(row)
                root.addView(btn("â–¼") { presentation?.move(0, 1) })
                root.addView(btn("Home") { bringHomeToTv() })
                setContentView(root)
            }

            private fun btn(t: String, onClick: () -> Unit) = Button(this).apply {
                text = t
                textSize = 24f
                setOnClickListener { onClick() }
            }

            // ---- External display handling ----
            private fun refreshDisplay() {
                val ext = dm.getDisplays(DisplayManager.DISPLAY_CATEGORY_PRESENTATION).firstOrNull()
                    ?: dm.displays.firstOrNull { it.displayId != Display.DEFAULT_DISPLAY }
                if (ext?.displayId == tvDisplay?.displayId && presentation != null) return
                presentation?.dismiss()
                presentation = null
                tvDisplay = ext
                if (ext == null) {
                    status.text = "طھظ„ظˆغŒط²غŒظˆظ† ظˆطµظ„ ظ†غŒط³طھ"
                    return
                }
                presentation = TvPresentation(this, ext, apps).also { it.show() }
                status.text = "ط¨ظ‡ طھظ„ظˆغŒط²غŒظˆظ† ظˆطµظ„ ط´ط¯"
            }

            private fun bringHomeToTv() = refreshDisplay()

            // Wireless mode: opens the system Cast / Miracast screen. Once the TV is
            // connected, Android exposes it as a second display and the same TV home appears.
            private fun openWireless() {
                try {
                    startActivity(Intent(Settings.ACTION_CAST_SETTINGS))
                } catch (e: Exception) {
                    startActivity(Intent(Settings.ACTION_WIFI_SETTINGS))
                }
            }

            private fun launchSelected() {
                val d = tvDisplay ?: return
                val item = apps.getOrNull(presentation?.selected ?: return) ?: return
                val intent = packageManager.getLaunchIntentForPackage(item.pkg) ?: return
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                val opts = ActivityOptions.makeBasic().setLaunchDisplayId(d.displayId)
                try {
                    startActivity(intent, opts.toBundle())
                } catch (e: Exception) {
                    Toast.makeText(this, "ط§غŒظ† ط§ظ¾ ط±ظˆغŒ طھظ„ظˆغŒط²غŒظˆظ† ط¨ط§ط² ظ†ط´ط¯", Toast.LENGTH_LONG).show()
                }
            }

            override fun onDisplayAdded(id: Int) = refreshDisplay()
            override fun onDisplayRemoved(id: Int) = refreshDisplay()
            override fun onDisplayChanged(id: Int) {}

            override fun onDestroy() {
                dm.unregisterDisplayListener(this)
                presentation?.dismiss()
                super.onDestroy()
            }
        }
