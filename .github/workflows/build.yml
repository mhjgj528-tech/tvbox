            fun move(dx: Int, dy: Int) {
                if (apps.isEmpty()) return
                val next = selected + dx + dy * columns
                if (next in apps.indices) select(next)
            }

            private fun select(i: Int) {
                cells.getOrNull(selected)?.background = null
                selected = i
                val c = cells.getOrNull(i) ?: return
                c.background = GradientDrawable().apply {
                    setColor(Color.parseColor("#2A3440"))
                    setStroke(6, Color.WHITE)
                    cornerRadius = 24f
                }
                c.post { scroll.smoothScrollTo(0, (c.parent as GridLayout).top + c.top - 200) }
            }
        }
